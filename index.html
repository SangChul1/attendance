<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>도깨비 문파 출석부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 상단 문파 헤더 + 탭 3개(출석 체크 / 통계 / 문파원·설정). 체크 탭은 회차 목록 | 체크리스트 2열, 모바일은 1열 */
:root{
  --bg:#eaefee; --surface:#fbfcfc; --sunken:#f1f5f4; --ink:#16242a; --muted:#5a6b70; --line:#d2dcda;
  --accent:#1f6d68; --accent-soft:#d6ebe8; --accent-ink:#ffffff;
  --seal:#b3372b; --seal-soft:#f6dedb; --good:#2c7a4c; --good-soft:#dcefe3; --warn:#9c6a12; --warn-soft:#f5ead2;
  --c-yosin:#2a776c; --c-gyeol:#3a5a9a; --c-singi:#9c6f22; --c-mihok:#874682;
  --k0:#9c6f22; --k1:#874682; --k2:#2a776c; --k3:#3a5a9a; --k4:#a2462f; --k5:#5b6b1f; --k6:#2f6f93; --k7:#6b5d4f;
  --scrim:rgba(10,20,22,.45);
  --f-display:"Song Myung","Nanum Myeongjo","Batang",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e181b; --surface:#152328; --sunken:#111d21; --ink:#e2ebe9; --muted:#8fa2a3; --line:#273e43;
  --accent:#53b5aa; --accent-soft:#183a38; --accent-ink:#04201d;
  --seal:#ec7466; --seal-soft:#3d1f1c; --good:#62c48c; --good-soft:#173527; --warn:#e3ad4f; --warn-soft:#3a2d14;
  --c-yosin:#5cc1b1; --c-gyeol:#86a4e4; --c-singi:#dcb062; --c-mihok:#cc8fc8; --k0:#dcb062; --k1:#cc8fc8; --k2:#5cc1b1; --k3:#86a4e4; --k4:#e88a72; --k5:#b5c46a; --k6:#7cc0e6; --k7:#c2b3a3; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e181b; --surface:#152328; --sunken:#111d21; --ink:#e2ebe9; --muted:#8fa2a3; --line:#273e43;
  --accent:#53b5aa; --accent-soft:#183a38; --accent-ink:#04201d;
  --seal:#ec7466; --seal-soft:#3d1f1c; --good:#62c48c; --good-soft:#173527; --warn:#e3ad4f; --warn-soft:#3a2d14;
  --c-yosin:#5cc1b1; --c-gyeol:#86a4e4; --c-singi:#dcb062; --c-mihok:#cc8fc8; --k0:#dcb062; --k1:#cc8fc8; --k2:#5cc1b1; --k3:#86a4e4; --k4:#e88a72; --k5:#b5c46a; --k6:#7cc0e6; --k7:#c2b3a3; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.brand{display:flex;align-items:center;gap:14px}
.seal{width:46px;height:46px;flex:none;border-radius:8px;background:var(--seal);color:#fff;display:grid;place-items:center;
  font-family:var(--f-display);font-size:24px;line-height:1;transform:rotate(-4deg)}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,4vw,32px);margin:0;line-height:1.15;text-wrap:balance}
.brand .sub{color:var(--muted);font-size:13px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)} .dot.err{background:var(--seal)}

nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;padding:10px 16px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
h2{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0;line-height:1.3}
h3{font-size:14px;margin:0;font-weight:600}
.hint{color:var(--muted);font-size:13px;margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.grow{flex:1}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--seal);border-color:var(--seal)}
.btn.small{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical;min-height:84px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;
  color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,transparent)}
.chip::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--cc)}
.chip{--cc:var(--k7)}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--sunken);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.tag.extra{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.tag.rank{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.pill-low{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--seal-soft);color:var(--seal);white-space:nowrap}
.pill-streak{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}

/* 출석 체크 */
.check-grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.check-grid{grid-template-columns:minmax(0,1fr)}}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.quick button{text-align:left;border:1px solid var(--line);background:var(--sunken);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.quick button:hover{border-color:var(--cc)}
.quick .qn{font-weight:600;font-size:14px;color:var(--cc)}
.quick .qs{font-size:11px;color:var(--muted)}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:end}
.formgrid .full{grid-column:1/-1}
.slist{display:flex;flex-direction:column;gap:2px;max-height:520px;overflow-y:auto;margin:0 -6px;padding:0 6px}
.sday{font-size:12px;color:var(--muted);font-weight:600;padding:10px 4px 4px}
.sitem{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:8px;border:1px solid transparent;background:none;text-align:left;width:100%;flex-wrap:wrap}
.sitem:hover{background:var(--sunken)}
.sitem[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.sitem .cnt{margin-left:auto;font-size:12px;color:var(--muted)}

.counts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.counts b{font-weight:600}
.c-o{color:var(--good)} .c-a{color:var(--warn)} .c-x{color:var(--seal)} .c-n{color:var(--muted)}
.notebox{background:var(--sunken);border-radius:8px;padding:8px 12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.mlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mrow .nm{flex:1 1 140px;min-width:0;display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;overflow-wrap:anywhere}
.by{font-size:11px;color:var(--muted);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:13px;font-weight:500;color:var(--muted);min-width:56px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"][data-v="O"]{background:var(--good);color:#fff}
.seg button[aria-pressed="true"][data-v="A"]{background:var(--warn);color:#fff}
.seg button[aria-pressed="true"][data-v="X"]{background:var(--seal);color:#fff}
.seg button:disabled{cursor:default}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px;border-radius:8px;background:var(--seal-soft);color:var(--seal);font-size:13px}

/* 통계 */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:720px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile .v{font-size:28px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--muted);letter-spacing:.02em}
.tile.alert .v{color:var(--seal)}
.scroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tr.low td{background:color-mix(in srgb,var(--seal) 7%,transparent)}
tr.low td:first-child{box-shadow:inset 3px 0 0 var(--seal)}
.rate{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.bar{width:80px;height:6px;border-radius:3px;background:var(--sunken);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}
tr.low .bar i{background:var(--seal)}
.dash{color:var(--muted)}
.heat{border-radius:6px;padding:4px 8px;display:inline-block;min-width:64px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
svg text{fill:var(--muted);font-family:var(--f-body)}
.demo-banner{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:500}
.attn{display:flex;flex-wrap:wrap;gap:8px}
.attn .who{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;background:var(--sunken);border:1px solid var(--line);font-size:14px}
textarea.preview{min-height:180px;font-size:13px;line-height:1.6}

.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{color:var(--ink);font-size:16px}

/* 문파원 */
.members-grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.members-grid{grid-template-columns:minmax(0,1fr)}}
.medit{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.medit input[type=text]{flex:1 1 140px}
.medit.off{opacity:.55}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);z-index:30}
.overlay{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:25;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.overlay .panel{width:min(520px,100%)}
.authwho{font-size:13px;color:var(--muted)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--sunken);border:1px solid var(--line);border-radius:6px;padding:2px 6px;overflow-wrap:anywhere}
.mk{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.mk.O{background:var(--good-soft);color:var(--good)} .mk.A{background:var(--warn-soft);color:var(--warn)} .mk.X{background:var(--seal-soft);color:var(--seal)}
.pill-perfect{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.rec{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rec .d{min-width:76px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
input[type=date].mini{padding:5px 8px;font-size:13px}
.subtabs{display:flex;gap:4px;padding:4px;background:var(--sunken);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.subtabs button{flex:1 0 auto;border:0;background:none;padding:8px 14px;border-radius:7px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
.subtabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 12%,transparent)}
.rk{display:grid;grid-template-columns:28px minmax(0,1fr) 150px 64px;grid-template-areas:"no name rate pts";gap:4px 12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.rk.low{background:color-mix(in srgb,var(--seal) 6%,transparent);box-shadow:inset 3px 0 0 var(--seal)}
.rk .no{grid-area:no;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;text-align:center}
.rk .nm{grid-area:name;min-width:0;display:flex;flex-direction:column;gap:2px}
.rk .nm .t{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:600;overflow-wrap:anywhere}
.rk .nm .sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rk .rt{grid-area:rate;display:flex;flex-direction:column;gap:3px}
.rk .rt .top{display:flex;align-items:center;gap:8px}
.rk .rt .pc{font-weight:700;font-variant-numeric:tabular-nums;min-width:42px;text-align:right}
.rk .rt .bar{flex:1;width:auto}
.rk .rt .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.rk.low .bar i{background:var(--seal)}
.rk .pt{grid-area:pts;text-align:right;font-variant-numeric:tabular-nums}
.rk .pt b{font-size:17px}
.rk .pt span{font-size:11px;color:var(--muted)}
@media (max-width:600px){.rk{grid-template-columns:24px minmax(0,1fr) auto;grid-template-areas:"no name pts" "no rate rate"}}
.toplist{display:flex;flex-direction:column}
.toplist .it{display:grid;grid-template-columns:24px minmax(0,1fr) 90px 42px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.toplist .it .bar{width:auto}
.toplist .it b{text-align:right;font-variant-numeric:tabular-nums}
.attnlist{display:flex;flex-direction:column}
.attnlist .it{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid var(--line)}
.attnlist .it .n{font-weight:600;margin-right:auto}
.tag.dup{color:var(--seal);background:var(--seal-soft);border-color:transparent}
.cfg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:820px){.cfg-grid{grid-template-columns:minmax(0,1fr)}}
.cfg-group{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--sunken);min-width:0}
.cfg-group input,.cfg-group select{background:var(--surface)}
.cfg-group h3{font-size:14px}
.hist{display:flex;flex-direction:column;gap:0;max-height:320px;overflow-y:auto}
.hist .it{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;overflow-wrap:anywhere}
.hist .it .w{color:var(--muted);font-variant-numeric:tabular-nums}
.dist td:nth-child(3){font-weight:700}
.up{color:var(--good);font-size:12px;font-weight:600} .down{color:var(--seal);font-size:12px;font-weight:600}
.lockbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;background:var(--sunken);border:1px solid var(--line);font-size:13px}
.lockbar.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.medit .acts{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
@media (max-width:600px){.medit .acts{flex-basis:100%;margin-left:0}}
.memo{font-size:12px;color:var(--muted);flex-basis:100%;white-space:pre-wrap;overflow-wrap:anywhere}
.inline-form{flex-basis:100%;display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:8px;background:var(--sunken);border:1px solid var(--line)}
.ct-card{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--sunken)}
.ct-card.off{opacity:.6}
.ct-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ct-head .sw{width:12px;height:12px;border-radius:3px;background:var(--cc);flex:none}
.daypick{display:flex;flex-wrap:wrap;gap:4px}
.daypick label{display:inline-flex;align-items:center;gap:3px;font-size:13px;padding:3px 7px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer}
.daypick input{margin:0}
.sec-title{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.readonly-note{font-size:13px;color:var(--muted);background:var(--sunken);border:1px dashed var(--line);border-radius:8px;padding:8px 12px}
@media (prefers-reduced-motion:no-preference){.sitem,.btn,.seg button{transition:background-color .12s,border-color .12s,color .12s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="seal" aria-hidden="true">鬼</div>
      <div>
        <h1 id="guildTitle">문파 출석부</h1>
        <div class="sub">도깨비의세계 · 신기쟁탈전 · 미혹의 정원 · 요신 토벌령 · 결계지 방어</div>
      </div>
    </div>
    <div class="row"><div class="sync" id="sync"><span class="dot"></span><span>저장소 연결 중</span></div><div class="row" id="authbar"></div></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-action="tab" data-tab="check" aria-selected="true">출석 체크</button>
    <button role="tab" data-action="tab" data-tab="stats" aria-selected="false">통계</button>
    <button role="tab" data-action="tab" data-tab="settle" aria-selected="false">월간 정산</button>
    <button role="tab" data-action="tab" data-tab="me" aria-selected="false">내 출석</button>
  </nav>
  <main id="app"><div class="panel"><div class="empty"><h3>출석부를 불러오는 중</h3><p class="hint">잠시만 기다려 주세요.</p></div></div></main>

/* 사전공지 면제: 문파원마다 한 달에 정해진 횟수까지 E(면제), 넘으면 XA(불참 처리) */
let EFF=null;
function getEff(){
  if(EFF)return EFF;
  const {members,sessions}=data();const byId=new Map(members.map(m=>[m.id,m]));const lim=excuseLimit();
  const ord=s=>CONTENTS.findIndex(c=>c.k===s.content);
  const reg=sessions.filter(s=>!isBonus(s)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(ord(a)-ord(b))||((a.createdAt||0)-(b.createdAt||0)));
  const used={},map=new Map();
  for(const s of reg){const mk=marksOf(s),e={},mon=s.date.slice(0,7);
    for(const id in mk){const v=mk[id];if(!validMark(v))continue;const m=byId.get(id);if(m&&!eligible(m,s))continue;
      if(v==='A'){const k=id+'|'+mon,u=used[k]||0;if(u<lim){e[id]='E';used[k]=u+1}else e[id]='XA'}else e[id]=v}
    map.set(s.id,e)}
  return EFF=map;
}
function effOf(s,id){if(isBonus(s)){const v=marksOf(s)[id];return validMark(v)?v:null}const e=getEff().get(s.id);return (e&&e[id])||null}

  let n=0;for(const s of ss){const v=effOf(s,m.id);if(!v||v==='E')continue;if(v==='O')break;n++}return n;
}

  else{let last='';const mid=new Map(members.map(m=>[m.id,m]));const dk={};S.sessions.forEach(x=>{const k=sessId(x.date,x.content,x.extra);dk[k]=(dk[k]||0)+1});for(const s of sessions.slice(0,80)){

function findSession(date,k,extra){return S.sessions.find(s=>s.date===date&&s.content===k&&!!s.extra===!!extra)}

      ${can&&!editing?`<button class="btn small" data-action="edit" data-sid="${s.id}">회차 수정 · 메모</button><button class="btn small danger" data-action="askDel" data-sid="${s.id}">삭제</button>`:''}

    <div class="mlist">${rows||'<p class="hint" style="padding:12px 2px">조건에 맞는 문파원이 없어요.</p>'}</div>
    ${leaveNames.length?`<p class="hint">휴식 중이라 이 회차에서 빠진 문파원: ${leaveNames.map(esc).join(', ')}</p>`:''}
    <p class="hint">${s.extra?'추가 진행 회차는 출석률·개근에 들어가지 않고, 참여하면 보너스 포인트만 붙어요. ':''}체크하지 않은 사람은 출석률 계산에서 빠지지만 그 달 개근은 안 돼요. 같은 칸을 한 번 더 누르면 체크가 지워져요.${meta?'<br>'+meta:''}</p>
  </div>`;
}
function renderHist(){
  const H=S.hist;if(H.loading)return '<p class="hint">변경 이력을 불러오는 중이에요…</p>';
  if(H.error)return `<div class="confirm">${esc(H.error)}</div>`;
  const L={O:'참여',A:'사전공지',X:'불참'};const lb=v=>v?L[v]||v:'미체크';
  const items=H.list.slice(0,60).map(l=>{let t='';
    if(l.type==='mark'){const ch=Object.values(l.changes||{});t=ch.slice(0,10).map(c=>`${esc(c.n||'?')} ${lb(c.f)}→${lb(c.t)}`).join(', ')+(ch.length>10?` 외 ${ch.length-10}명`:'')}
    else if(l.type==='edit')t=`회차 수정: ${esc(l.before?.date||'')} ${esc(CMAP[l.before?.content]?.name||'')}${l.before?.extra?'(추가)':''} → ${esc(l.after?.date||'')} ${esc(CMAP[l.after?.content]?.name||'')}${l.after?.extra?'(추가)':''}`;
    else if(l.type==='restore')t='삭제된 회차를 복원함';
    else t=esc(l.type||'');
    return `<div class="it"><span class="w">${l.at?hm(l.at):''} · ${esc(l.by||'')}</span><br>${t}</div>`}).join('');
  return `<div class="panel" style="padding:12px;background:var(--sunken)"><div class="spread"><h3>변경 이력</h3><button class="btn small" data-action="hist" data-sid="${esc(H.sid)}">닫기</button></div>
    <div class="hist">${items||'<p class="hint">기록된 변경이 없어요. 이 기능을 넣기 전 체크는 이력이 없어요.</p>'}</div></div>`;
}
async function loadHist(sid){

}

function sessionText(s){
  const members=activeMembers(S.members).filter(m=>eligible(m,s));const mk=marksOf(s);
  const g={O:[],A:[],X:[],N:[]};members.forEach(m=>g[validMark(mk[m.id])?mk[m.id]:'N'].push(m.name));
  const L=[`[${mdd(s.date)} ${CMAP[s.content]?.name||s.content}${s.extra?' · 추가 진행':''}]${s.rank?' '+s.rank:''}`,
    `참여 ${g.O.length} · 사전공지 ${g.A.length} · 불참 ${g.X.length}${g.N.length?' · 미체크 '+g.N.length:''}`];
  if(g.O.length)L.push('','참여: '+g.O.join(', '));
  if(g.A.length)L.push('사전공지: '+g.A.join(', '));

  if(g.N.length)L.push('미체크: '+g.N.join(', '));

/* ---------- stats ---------- */
function computeStats(opt){
  const {members:allM,sessions:allS}=data();
  const members=opt&&opt.all?allM.slice().sort(memberSort):activeMembers(allM);
  const mid=new Map(members.map(m=>[m.id,m]));
  const from=periodFrom();
  const sessions=from?allS.filter(s=>s.date>=from):allS.slice();
  const inF=s=>S.cfilter==='all'||s.content===S.cfilter;
  const scoped=sessions.filter(inF);
  const W=warnCfg(),mj=minJudge(),th=W.rate/100,sk=streakMin();
  const per={};members.forEach(m=>per[m.id]={m,O:0,E:0,X:0,XA:0,P:0,B:0,byC:Object.fromEntries(CONTENTS.map(c=>[c.k,{O:0,E:0,X:0}]))});
  for(const s of sessions){
    for(const m of members){if(!eligible(m,s))continue;const v=effOf(s,m.id);if(!v)continue;const p=per[m.id];
      if(isBonus(s)){if(inF(s)&&v==='O'){p.B++;p.P+=sessPts(s)}continue}
      const b=p.byC[s.content];if(b){if(v==='O')b.O++;else if(v==='E')b.E++;else b.X++}
      if(!inF(s))continue;
      if(v==='O'){p.O++;p.P+=sessPts(s)}else if(v==='E')p.E++;else if(v==='XA')p.XA++;else p.X++}}
  const rows=Object.values(per).map(p=>{
    const absent=p.X+p.XA,T=p.O+p.E+absent,rate=rateOf(p.O,absent);
    const mO=MAIN.reduce((a,k)=>a+p.byC[k].O,0),mX=MAIN.reduce((a,k)=>a+p.byC[k].X,0),mT=MAIN.reduce((a,k)=>a+p.byC[k].O+p.byC[k].E+p.byC[k].X,0);
    const hold=T<mj,streak=streakOf(p.m,S.cfilter==='all'?null:inF);
    const mainRate=rateOf(mO,mX),lv=W.scope==='main'?mainRate:rate,lowHold=W.scope==='main'?mT<mj:hold;
    return {...p,absent,T,rate,mainRate,mT,hold,streak,low:!lowHold&&lv!=null&&lv<th,lowVal:lv,streakHit:streak>=sk}});
  rows.sort((a,b)=>(a.hold-b.hold)||(b.rate??-1)-(a.rate??-1)||b.O-a.O||memberSort(a.m,b.m));
  let tO=0,tX=0;rows.forEach(r=>{tO+=r.O;tX+=r.absent});
  const wk={};
  for(const s of scoped){const w=weekStart(s.date);const c=countSession(s,mid);
    const W=wk[w]??={w,n:0,o:0,x:0,byC:{},bonus:null};
    if(isBonus(s)){const B=W.bonus??={n:0,o:0};B.n++;B.o+=c.o;continue}
    W.n++;W.o+=c.o;W.x+=c.x;const B=W.byC[s.content]??={n:0,o:0};B.n++;B.o+=c.o}
  const weeks=Object.values(wk).sort((a,b)=>a.w<b.w?-1:1);
  const dc={};
  for(const s of sessions){const cc=CMAP[s.content];if(!cc||(cc.days.length<2&&!cc.extraDays.length))continue;const key=isBonus(s)?'추가':String(dow(s.date));const c=countSession(s,mid);
    const D=dc[s.content]??={};const C=D[key]??={n:0,o:0,x:0};C.n++;C.o+=c.o;C.x+=c.x}
  return {members,rows,scoped,sessionsN:scoped.length,regN:scoped.filter(s=>!isBonus(s)).length,avg:rateOf(tO,tX),attn:rows.filter(r=>r.low||r.streakHit),weeks,dc,th,sk,mj};
}
function heat(rate){if(rate==null)return '';const col=rate>=0.7?'var(--good)':rate>=0.4?'var(--warn)':'var(--seal)';return `background:color-mix(in srgb,${col} ${8+Math.round(rate*16)}%,transparent);color:${col}`}
function excuseText(){const l=excuseLimit();return l===0?'사전공지도 불참으로 계산':l>=31?'사전공지는 모두 면제':`사전공지는 한 달에 ${l}회까지 면제, 넘으면 불참으로 계산`}
function rateFormula(){return `출석률 = 참여 ÷ (참여+불참) · ${excuseText()} · 추가 진행 회차는 제외 · 정규 ${minJudge()}회 미만은 판정 보류`}
function kakaoText(st){
  const g=S.config.guild?`[${S.config.guild} 문파] `:'';
  const L=[`${g}출석 현황 · ${periodLabel()}${S.cfilter!=='all'?' · '+(CMAP[S.cfilter]?.name||''):''}`,`정규 ${st.regN}회${st.sessionsN>st.regN?' · 추가 '+(st.sessionsN-st.regN)+'회':''} · 평균 출석률 ${pct(st.avg)}`];
  const top=st.rows.filter(r=>!r.hold&&r.rate!=null&&r.O>0&&!r.low).slice(0,5);
  if(top.length){L.push('','▶ 출석 우수');top.forEach((r,i)=>L.push(`${i+1}. ${r.m.name} ${pct(r.rate)} (참여 ${r.O}회)`))}
  const low=st.rows.filter(r=>r.low).sort((a,b)=>a.lowVal-b.lowVal);
  L.push('',`▶ 출석 저조 (${warnCfg().scope==='main'?mainLabel()+' ':''}${Math.round(st.th*100)}% 미만)`,low.length?low.map(r=>`${r.m.name} ${pct(r.lowVal)}`).join(', '):'없음');
  const sk=st.rows.filter(r=>r.streakHit).sort((a,b)=>b.streak-a.streak);
  L.push('',`▶ 연속 불참 ${st.sk}회 이상`,sk.length?sk.map(r=>`${r.m.name} ${r.streak}회`).join(', '):'없음');
  const hold=st.rows.filter(r=>r.hold).length;if(hold)L.push('',`(정규 ${st.mj}회 미만 ${hold}명은 판정 보류)`);
  return L.join('\n');
}
function renderStats(){
  if(!S.ready&&!S.demo) return loading;

function weekChart(wv){
  const W=520,H=170,L=34,R=8,T=14,B=28,iw=W-L-R,ih=H-T-B;const n=wv.length;const step=iw/n;const bw=Math.min(36,step*0.6);

  wv.forEach((w,i)=>{const r=rateOf(w.o,w.x)??0;const h=ih*r;const x=L+step*i+(step-bw)/2;const last=i===n-1;
    g+=`<rect x="${x}" y="${T+ih-h}" width="${bw}" height="${Math.max(h,1)}" rx="3" fill="var(--accent)" opacity="${last?1:.55}"><title>${md(w.w)} 주 ${pct(r)}</title></rect>`;
    if(last||n<=8)g+=`<text x="${x+bw/2}" y="${Math.max(T+ih-h-4,11)}" text-anchor="middle" font-size="11" style="fill:var(--ink)">${Math.round(r*100)}</text>`;
    if(n<=8||i%2===(n-1)%2)g+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="11">${md(w.w)}~</text>`});
  return `<div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;min-width:300px;display:block" role="img" aria-label="주간 출석률 막대그래프">${g}</svg></div>`;
}

function monthList(){return [...new Set(data().sessions.map(s=>s.date.slice(0,7)))].sort().reverse()}
function curMonth(){const ml=monthList();return ml.includes(S.month)?S.month:(ml[0]||todayStr().slice(0,7))}
function monthStats(mon){
  const {members:allM,sessions:allS}=data();const members=activeMembers(allM);
  const ss=allS.filter(s=>s.date.slice(0,7)===mon);const reg=ss.filter(s=>!isBonus(s)).length;
  const W=warnCfg(),mj=minJudge();
  const rows=members.map(m=>{let O=0,E=0,X=0,XA=0,B=0,P=0,need=0,ok=0,mO=0,mX=0,mT=0;
    for(const s of ss){if(!eligible(m,s))continue;const v=effOf(s,m.id);
      if(isBonus(s)){if(v==='O'){B++;P+=sessPts(s)}continue}
      need++;if(!v)continue;const main=MAIN.includes(s.content);if(main)mT++;
      if(v==='O'){O++;ok++;P+=sessPts(s);if(main)mO++}else if(v==='E'){E++;ok++}else{if(v==='XA')XA++;else X++;if(main)mX++}}
    const absent=X+XA,T=O+E+absent,rate=rateOf(O,absent),mainRate=rateOf(mO,mX);
    const hold=(W.basis==='rate'&&W.scope==='main'?mT:T)<mj;
    const val=W.basis==='points'?P:(W.scope==='main'?mainRate:rate);
    const ptsNeed=reg?Math.round(W.pts*need/reg*10)/10:W.pts;
    const fail=!hold&&(W.basis==='points'?P<ptsNeed:(val!=null&&val<W.rate/100));
    return {m,O,E,X,XA,absent,B,P,T,need,rate,mainRate,hold,val,fail,ptsNeed,perfect:need>0&&O>0&&ok===need}}).filter(r=>r.need>0||r.B>0);
  rows.sort((a,b)=>b.P-a.P||b.O-a.O||memberSort(a.m,b.m));
  return {mon,n:ss.length,reg,rows,done:mon<todayStr().slice(0,7)};
}
const monLabel=mon=>{const[y,m]=mon.split('-');return `${y}년 ${+m}월`};
function perfectRule(){return `개근 = 그 달 정규 회차를 모두 참여 · 면제된 사전공지는 괜찮고, 체크 안 된 회차가 있으면 개근이 아니에요`}
function critText(){const W=warnCfg();return W.basis==='points'?`월 포인트 ${W.pts}점 미만`:`월 ${W.scope==='main'?mainLabel():'정규'} 출석률 ${W.rate}% 미만`}
function valText(r){return warnCfg().basis==='points'?`${r.P}점${r.ptsNeed!==warnCfg().pts?` / 기준 ${r.ptsNeed}점`:''}`:pct(r.val)}
function renderSettle(){
  if(!S.ready&&!S.demo) return loading;
  const ml=monthList();if(!ml.length)return `<div class="panel"><div class="empty"><h3>정산할 기록이 아직 없어요</h3><p class="hint">출석 체크를 하면 달마다 포인트와 개근이 여기에 정리돼요.</p><button class="btn" data-action="demo">예시 데이터로 미리보기</button></div></div>`;

function calcDist(){
  const ms=monthStats(curMonth());const N=Math.floor(+$('#dQty').value);if(!(N>0)){toast('총 수량을 입력해 주세요');return}
  const name=$('#dName').value.trim()||'보상',mode=$('#dMode').value==='equal'?'equal':'pts',exF=$('#dExF').checked,exH=$('#dExH').checked;
  const elig=ms.rows.filter(r=>r.P>0&&!(exF&&r.fail)&&!(exH&&r.hold));
  if(!elig.length){S.dist=null;render();toast('조건에 맞는 문파원이 없어요');return}
  const tot=mode==='equal'?elig.length:elig.reduce((a,r)=>a+r.P,0);
  const items=elig.map(r=>{const raw=N*(mode==='equal'?1:r.P)/tot;const n=Math.floor(raw+1e-9);return {r,n,frac:raw-n}});
  let left=N-items.reduce((a,x)=>a+x.n,0);
  items.slice().sort((a,b)=>b.frac-a.frac||b.r.P-a.r.P||memberSort(a.r.m,b.r.m)).forEach(x=>{if(left>0){x.n++;left--}});
  items.sort((a,b)=>b.n-a.n||b.r.P-a.r.P||memberSort(a.r.m,b.r.m));
  S.dist={mon:ms.mon,name,N,mode,tot,exF,exH,items,excluded:ms.rows.filter(r=>!elig.includes(r))};render();
}
function distText(){const D=S.dist;if(!D)return '';const g=S.config.guild?`[${S.config.guild} 문파] `:'';

/* ---------- CSV 가져오기 ---------- */
function parseCsv(t){t=t.replace(/^﻿/,'');const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===','){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}
    else cur+=c}
  if(cur||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()));
}
async function loadOlderAll(){
  if(S.olderRange==='all'||!S.db||!S.cutoff)return;
  const snap=await S.db.collection('sessions').where('date','<',S.cutoff).orderBy('date','desc').get();
  S.older=snap.docs.map(d=>normS({id:d.id,...d.data()})).filter(s=>s.date&&s.content);S.olderRange='all';
}
function buildImport(text){
  const rows=parseCsv(text);if(rows.length<2)return {error:'내용이 없는 파일이에요.'};
  const h=rows[0].map(x=>x.trim());if(h[0]!=='닉네임')return {error:'이 페이지에서 내보낸 CSV가 아니에요. 첫 칸 제목이 "닉네임"이어야 해요.'};
  const SH={};if(CMAP.rank){SH['요신']='rank';SH['결계']='rank'}CONTENTS.forEach(c=>{SH[c.short]=c.k});const alt=Object.keys(SH).sort((a,b)=>b.length-a.length).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');const cols=[];
  const re=new RegExp('^(\\d{4}-\\d{2}-\\d{2})(?:\\([^)]*\\))?\\s*('+alt+')(\\(추가\\))?$');h.forEach((x,i)=>{const m=x.match(re);if(m)cols.push({i,date:m[1],content:SH[m[2]],extra:!!m[3]})});
  if(!cols.length)return {error:'회차 열을 찾지 못했어요. 날짜에 연도가 들어간 CSV(이번 버전에서 내보낸 파일)만 가져올 수 있어요.'};
  const ri=h.indexOf('직위'),si=h.indexOf('상태'),ji=h.indexOf('가입일');const MK={'참여':'O','사전공지':'A','불참':'X'};const people=[];let marks=0;
  for(const r of rows.slice(1)){const name=(r[0]||'').trim().slice(0,24);if(!name)continue;
    const rr=ri>=0?(r[ri]||'').trim():'';const mk={};
    cols.forEach((c,ci)=>{const v=MK[(r[c.i]||'').trim()];if(v){mk[ci]=v;marks++}});
    const jd=ji>=0?(r[ji]||'').trim():'';people.push({name,role:ROLES.includes(rr)?rr:'문파원',mk,active:!(si>=0&&(r[si]||'').trim()==='탈퇴'),joinedAt:/^\d{4}-\d{2}-\d{2}$/.test(jd)?jd:''})}
  const have=new Set(S.members.map(m=>m.name));
  const newSess=cols.filter(c=>!findAny(c.date,c.content,c.extra)).length;
  return {cols,people,marks,newPeople:people.filter(x=>!have.has(x.name)).length,newSess,oldSess:cols.length-newSess};
}

  S.imp={loading:true};render();

  S.imp=ok?{finished:true,count:I.cols.length-(I.skipped||0),skipped:I.skipped||0}:null;render();if(ok)toast('가져오기를 마쳤어요');

    <input type="file" id="impFile" data-keep="0" accept=".csv,text/csv" data-action="impFile" aria-label="CSV 파일 고르기">${body}</div>`;
}

/* ---------- writes ---------- */
async function guard(fn,okMsg){
  if(!S.db){toast('저장소에 연결되지 않았어요');return false}
  try{await fn();if(okMsg)toast(okMsg);return true}catch(e){
    if(e&&e.code==='invalid_argument'){toast('저장 권한이 없어요. 운영진 등록과 Firestore 규칙이 최신인지 확인해 주세요');console.warn(e);return false}
    if(e&&e.code==='quota_exceeded'){toast('오늘 무료 사용량을 다 썼어요. 오후 4~5시쯤 초기화된 뒤 다시 시도해 주세요');return false}
    toast('저장하지 못했어요. 잠시 후 다시 시도해 주세요');console.error(e);return false}
}
async function createSess(date,content,extra){
  const data={date,content,extra:!!extra,marks:{},marksBy:{},note:'',rank:'',createdAt:Date.now(),createdBy:myName()};
  const id=sessId(date,content,extra);
  if(await S.db.create('sessions/'+id,data))return id;
  const x=await S.db.doc('sessions/'+id).get();
  if(x.exists){const d=normS({id,...x.data()});if(d.date===date&&d.content===content&&!!d.extra===!!extra)return id}
  const ref=S.db.collection('sessions').doc();await ref.set(data);return ref.id;
}
async function createSession(date,content,extra){
  const ex=findAny(date,content,extra);
  if(!ex&&isLocked(date)){toast(`${monLabel(date.slice(0,7))}은 마감돼서 회차를 만들 수 없어요`);return}
  if(ex){S.openSid=ex.id;S.editSid=null;render();scrollSheet();return}
  await guard(async()=>{const id=await createSess(date,content,extra);S.openSid=id;S.editSid=null;render();scrollSheet()});
}
function scrollSheet(){if(innerWidth<820)$('#sheetCol')?.scrollIntoView({behavior:'smooth',block:'start'})}
function queueMark(sid,mid,v){(pending[sid]??={})[mid]=v;render();clearTimeout(flushTimer);flushTimer=setTimeout(flush,350)}
async function flush(){
  if(flushing){clearTimeout(flushTimer);flushTimer=setTimeout(flush,300);return}
  const batch=pending;pending={};if(!Object.keys(batch).length)return;flushing=true;
  for(const sid in batch){inflight[sid]=Object.assign(inflight[sid]||{},batch[sid])}
  for(const sid in batch){
    const s=S.sessions.find(x=>x.id===sid),before=(s&&s.marks)||{};
    const now=Date.now(),by={};for(const mid in batch[sid])by[mid]={by:myName(),at:now};
    const ok=await guard(()=>S.db.doc('sessions/'+sid).update({marks:batch[sid],marksBy:by,updatedAt:now,updatedBy:myName()}));
    if(ok&&s){const ch={};for(const mid in batch[sid]){const f=validMark(before[mid])?before[mid]:null,t=batch[sid][mid]||null;if(f!==t)ch[mid]={f,t,n:memberName(mid)}}
      if(Object.keys(ch).length)writeLog({type:'mark',sid,date:s.date,content:s.content,extra:!!s.extra,changes:ch})}
    for(const mid in batch[sid]){if(inflight[sid]&&inflight[sid][mid]===batch[sid][mid])delete inflight[sid][mid]}
  }
  flushing=false;render();
}
function copyText(text,msg){
  const fallback=()=>{const box=$('#copybox'),ta=$('#copyArea');ta.value=text;box.hidden=false;ta.focus();ta.select()};
  try{const p=navigator.clipboard&&navigator.clipboard.writeText(text);
    if(!p){fallback();return}
    p.then(()=>toast(msg||'복사했어요. 카톡에 붙여 넣으세요'),fallback)}catch(_){fallback()}
}

function exportCsv(){
  try{const blob=new Blob([csvText()],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=`문파출석_${todayStr()}${S.demo?'_예시':''}.csv`;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}catch(e){console.error(e);toast('파일을 만들지 못했어요')}
}

async function addMembers(){
  const ta=$('#addNames');const names=[...new Set(ta.value.split(/[\n,]+/).map(s=>s.trim().slice(0,24)).filter(Boolean))];
  if(!names.length){toast('닉네임을 입력해 주세요');return}
  const have=new Set(S.members.map(m=>m.name));const add=names.filter(n=>!have.has(n));const role=$('#addRole').value;const join=($('#addJoin')&&$('#addJoin').value)||'';
  if(!add.length){toast('모두 이미 명단에 있어요');return}
  let ok=0;
  await guard(async()=>{for(const name of add){await S.db.collection('members').doc().set({name,role,active:true,joinedAt:join,createdAt:Date.now(),createdBy:myName()});ok++}});
  if(ok){ta.value='';toast(ok+'명을 추가했어요'+(names.length>add.length?` (${names.length-add.length}명은 이미 있어서 건너뜀)`:''));render()}
}

/* ---------- demo (통계 미리보기 전용, 저장 안 함) ---------- */
let demoCache=null;
function demoData(){
  if(demoCache)return demoCache;
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const members=Array.from({length:14},(_,i)=>({id:'d'+i,name:'예시문파원'+(i+1),role:i===0?'문주':i<3?'부문주':i<5?'간부':'문파원',active:true,p:0.3+rnd()*0.65}));
  const sessions=[];const base=addDays(todayStr(),-((dow(todayStr())+6)%7));
  for(let w=7;w>=0;w--){const mon=addDays(base,-7*w);
    const days=[[addDays(mon,4),['singi','rank']],[addDays(mon,5),['mihok']]];
    if(rnd()<0.5)days.push([addDays(mon,1),['rank']]);
    for(const [d,ks] of days){if(d>todayStr())continue;ks.forEach(k=>{const marks={};
      members.forEach(m=>{const r=rnd();const p=m.p*(dow(d)===2?0.75:1);marks[m.id]=r<p?'O':r<p+0.12?'A':'X'});
      sessions.push({id:'s'+sessions.length,date:d,content:k,extra:dow(d)===2,marks})})}}
  return demoCache={members,sessions};
}

/* ---------- firebase adapter ---------- */
function mapErr(e){const c=(e&&e.code)||'';return {code:c==='permission-denied'?'invalid_argument':c==='resource-exhausted'?'quota_exceeded':c==='unavailable'?'unavailable':(c||'unavailable'),message:e&&e.message}}
const wrapSnap=x=>({id:x.id,exists:x.exists(),data:()=>x.exists()?x.data():undefined});
function flat(obj,pre,out){out=out||{};for(const k in obj){const v=obj[k];const key=pre?pre+'.'+k:k;
  if(v&&typeof v==='object'&&!Array.isArray(v)&&Object.keys(v).length)flat(v,key,out);else out[key]=v}return out}
function makeDb(fs){
  const D=ref=>({id:ref.id,path:ref.path,
    set:d=>setDoc(ref,d).catch(e=>{throw mapErr(e)}),
    update:d=>updateDoc(ref,flat(d)).catch(e=>{throw mapErr(e)}),
    delete:()=>deleteDoc(ref).catch(e=>{throw mapErr(e)}),
    get:()=>getDoc(ref).then(wrapSnap).catch(e=>{throw mapErr(e)}),
    onSnapshot:(n,er)=>fsnap(ref,x=>n(wrapSnap(x)),e=>er&&er(mapErr(e)))});
  const Q=(q,cref)=>({doc:id=>D(id?fdoc(cref,id):fdoc(cref)),
    get:()=>getDocs(q).then(x=>({docs:x.docs.map(wrapSnap),size:x.size,empty:x.empty})).catch(e=>{throw mapErr(e)}),
    orderBy:(f,d)=>Q(query(q,fOrder(f,d||'asc')),cref),where:(f,o,v)=>Q(query(q,fWhere(f,o,v)),cref),limit:n=>Q(query(q,fLimit(n)),cref),
    onSnapshot:(n,er)=>fsnap(q,x=>n({docs:x.docs.map(wrapSnap),size:x.size,empty:x.empty}),e=>er&&er(mapErr(e)))});
  return {doc:p=>D(fdoc(fs,p)),collection:p=>{const c=fcol(fs,p);return Q(c,c)},
    create:(p,d)=>runTransaction(fs,async tx=>{const r=fdoc(fs,p);const x=await tx.get(r);if(x.exists())return false;tx.set(r,d);return true}).catch(e=>{throw mapErr(e)})};
}

(function(){
  if(!FIREBASE_CONFIG.apiKey||!FIREBASE_CONFIG.projectId){S.setup=true;render();return}
  let app;try{app=initializeApp(FIREBASE_CONFIG)}catch(e){console.error(e);S.err=true;render();return}
  S.fs=getFirestore(app);S.auth=getAuth(app);S.db=makeDb(S.fs);
  const db=S.db;
  const got={m:false,s:false};const done=()=>{if(got.m&&got.s)S.ready=true;render()};
  const onErr=e=>{console.error(e);S.err=e&&e.code==='quota_exceeded'?'quota':true;render()};
  db.collection('members').onSnapshot(snap=>{S.members=snap.docs.map(d=>({id:d.id,...d.data()}));got.m=true;done()},onErr);
  S.cutoff=addDays(todayStr(),-182).slice(0,7)+'-01';
  db.collection('sessions').where('date','>=',S.cutoff).orderBy('date','desc').limit(1000).onSnapshot(snap=>{
    S.sessions=snap.docs.map(d=>normS({id:d.id,...d.data()})).filter(s=>s.date&&s.content);got.s=true;done()},onErr);
  db.collection('locks').onSnapshot(snap=>{S.locks=Object.fromEntries(snap.docs.map(d=>[d.id,d.data()]));render()},()=>{});
  db.doc('config/main').onSnapshot(snap=>{if(snap.exists)S.config=Object.assign({...CFG0},snap.data());render()},()=>{});
  let unAdmins=null,unWarn=null,unNotes=null,unRw=null;
  onAuthStateChanged(S.auth,async u=>{
    S.authKnown=false;
    S.authUser=u;S.canWrite=false;S.leaveFor=null;S.noteFor=null;S.cdraft=null;S.isOwner=false;S.myNick='';S.admins=[];if(unAdmins){unAdmins();unAdmins=null}
    if(unWarn){unWarn();unWarn=null}if(unNotes){unNotes();unNotes=null}if(unRw){unRw();unRw=null}S.notes={};S.rewards=[];S.warnings=[];S.warnBlocked=false;S.logBlocked=false;S.hist=null;S.delLogs=null;S.dist=null;
    if(u){
      const email=(u.email||'').toLowerCase();
      try{const x=await getDoc(fdoc(S.fs,'admins',email));if(x.exists()){S.canWrite=true;S.myNick=x.data().nick||''}}catch(_){}
      try{await getDocs(query(fcol(S.fs,'admins'),fLimit(1)));S.isOwner=true;S.canWrite=true;
        unAdmins=fsnap(fcol(S.fs,'admins'),x=>{S.admins=x.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>nameCmp(a.nick,b.nick,'ko'));render()},()=>{})}catch(_){}
      if(S.canWrite){const blk=e=>{console.warn(e);S.warnBlocked=true;render()};
        unWarn=fsnap(fcol(S.fs,'warnings'),x=>{S.warnings=x.docs.map(d=>({id:d.id,...d.data()}));render()},blk);
        unNotes=fsnap(fcol(S.fs,'notes'),x=>{S.notes=Object.fromEntries(x.docs.map(d=>[d.id,d.data()]));render()},blk);
        unRw=fsnap(fcol(S.fs,'rewards'),x=>{S.rewards=x.docs.map(d=>({id:d.id,...d.data()}));render()},blk)}
    }
    S.authKnown=true;render();
  });
})();
})();
</script>
</body>
</html>
