<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>도깨비 문파 출석부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&text=%E8%99%90%E6%AE%BA&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Layout: 상단 문파 헤더 + 탭 3개(출석 체크 / 통계 / 문파원·설정). 체크 탭은 회차 목록 | 체크리스트 2열, 모바일은 1열 */
:root{
  --bg:#eaefee; --surface:#fbfcfc; --sunken:#f1f5f4; --ink:#16242a; --muted:#5a6b70; --line:#d2dcda;
  --accent:#1f6d68; --accent-soft:#d6ebe8; --accent-ink:#ffffff;
  --seal:#b3372b; --seal-soft:#f6dedb; --good:#2c7a4c; --good-soft:#dcefe3; --warn:#9c6a12; --warn-soft:#f5ead2;
  --c-yosin:#2a776c; --c-gyeol:#3a5a9a; --c-singi:#9c6f22; --c-mihok:#874682;
  --k0:#9c6f22; --k1:#874682; --k2:#2a776c; --k3:#3a5a9a; --k4:#a2462f; --k5:#5b6b1f; --k6:#2f6f93; --k7:#6b5d4f;
  --scrim:rgba(10,20,22,.45);
  --f-seal:"Song Myung","Nanum Myeongjo","Batang",serif;
  --f-display:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-body:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e181b; --surface:#152328; --sunken:#111d21; --ink:#e2ebe9; --muted:#8fa2a3; --line:#273e43;
  --accent:#53b5aa; --accent-soft:#183a38; --accent-ink:#04201d;
  --seal:#ec7466; --seal-soft:#3d1f1c; --good:#62c48c; --good-soft:#173527; --warn:#e3ad4f; --warn-soft:#3a2d14;
  --c-yosin:#5cc1b1; --c-gyeol:#86a4e4; --c-singi:#dcb062; --c-mihok:#cc8fc8; --k0:#dcb062; --k1:#cc8fc8; --k2:#5cc1b1; --k3:#86a4e4; --k4:#e88a72; --k5:#b5c46a; --k6:#7cc0e6; --k7:#c2b3a3; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e181b; --surface:#152328; --sunken:#111d21; --ink:#e2ebe9; --muted:#8fa2a3; --line:#273e43;
  --accent:#53b5aa; --accent-soft:#183a38; --accent-ink:#04201d;
  --seal:#ec7466; --seal-soft:#3d1f1c; --good:#62c48c; --good-soft:#173527; --warn:#e3ad4f; --warn-soft:#3a2d14;
  --c-yosin:#5cc1b1; --c-gyeol:#86a4e4; --c-singi:#dcb062; --c-mihok:#cc8fc8; --k0:#dcb062; --k1:#cc8fc8; --k2:#5cc1b1; --k3:#86a4e4; --k4:#e88a72; --k5:#b5c46a; --k6:#7cc0e6; --k7:#c2b3a3; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);letter-spacing:-.005em;font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.brand{display:flex;align-items:center;gap:14px}
.seal{width:46px;height:46px;flex:none;border-radius:8px;background:var(--seal);color:#fff;display:grid;place-items:center;
  font-family:var(--f-seal);font-size:24px;line-height:1;transform:rotate(-4deg)}
.brand h1{font-family:var(--f-display);font-weight:700;letter-spacing:-.02em;font-size:clamp(24px,4vw,32px);margin:0;line-height:1.15;text-wrap:balance}
.brand .sub{color:var(--muted);font-size:14px}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)} .dot.err{background:var(--seal)}

nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;padding:10px 16px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
@media (max-width:560px){nav.tabs{gap:0}nav.tabs button{flex:1 0 auto;padding:10px 8px}.subtabs{flex-wrap:wrap}.subtabs button{padding:8px 10px}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
h2{font-family:var(--f-display);font-weight:700;letter-spacing:-.015em;font-size:21px;margin:0;line-height:1.3}
h3{font-size:15px;margin:0;font-weight:600}
.hint{color:var(--muted);font-size:14px;margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.grow{flex:1}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-size:15px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--seal);border-color:var(--seal)}
.btn.small{padding:4px 9px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical;min-height:84px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
label.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;
  color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,transparent)}
.chip::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--cc)}
.chip{--cc:var(--k7)}
.tag{font-size:12px;padding:1px 6px;border-radius:4px;background:var(--sunken);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.tag.extra{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.tag.rank{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.pill-low{font-size:12px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--seal-soft);color:var(--seal);white-space:nowrap}
.pill-streak{font-size:12px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}

/* 출석 체크 */
.wkgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wkcol{display:flex;flex-direction:column;gap:6px;min-width:0;padding:8px;border-radius:10px;background:var(--sunken);border:1px solid transparent}
.wkcol.today{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--sunken))}
.wkcol.none{opacity:.7}
.wk-d{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--muted)}
.wk-d b{font-size:16px;color:var(--ink)}
.wkcol.today .wk-d b{color:var(--accent)}
.wkcol .slot{flex:0 0 auto}
.slot .qn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xb{display:inline-block;font-size:11px;font-weight:600;padding:0 5px;border-radius:4px;background:var(--warn-soft);color:var(--warn);vertical-align:1px}
@media (max-width:900px){.wkcol{padding:6px}.wkcol .slot{padding:5px 7px}.wkcol .slot .qn{font-size:13px}}
@media (max-width:600px){.wkgrid{grid-template-columns:minmax(0,1fr)}.wkcol.none{display:none}.wkcol{flex-direction:row;flex-wrap:wrap;align-items:center}.wkcol .wk-d{min-width:72px}.wkcol .slot{flex:1 1 130px}}
.xform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--accent-soft)}
.settle-grid section{min-width:0}
.settle-grid .col{gap:20px}
@media (max-width:999px){
  .settle-grid section{display:none}
  .settle-grid.m-table [data-sec=table],.settle-grid.m-buy [data-sec=buy],.settle-grid.m-pay [data-sec=pay],.settle-grid.m-dist [data-sec=dist],.settle-grid.m-pay [data-sec=link],.settle-grid.m-dist [data-sec=link]{display:block}
  .settle-grid.m-table .settle-right,.settle-grid.m-buy .settle-right,.settle-grid.m-pay .settle-left,.settle-grid.m-dist .settle-left{display:none}
  .subtabs.calc-tabs{display:none}.subtabs.left-tabs{display:none}}
@media (min-width:1000px){
  .subtabs.settle-mtabs{display:none}
  .settle-grid{display:grid;grid-template-columns:auto minmax(340px,1fr);gap:20px;align-items:start}
  .settle-left{min-width:0;max-width:calc(100vw / var(--zoom,1) - 400px)}
  .settle-left>.subtabs,.settle-left section .panel>:not(.scroll){contain:inline-size}
  .settle-left section .scroll{max-width:100%}
  .settle-right{position:sticky;top:12px;max-height:calc(100vh / var(--zoom,1) - 24px);overflow:auto;padding-right:2px}
  .settle-right>*{flex-shrink:0}
  .settle-grid.d-pay [data-sec=dist],.settle-grid.d-dist [data-sec=pay]{display:none}
  .settle-grid.l-table [data-sec=buy],.settle-grid.l-buy [data-sec=table]{height:0;overflow:hidden;visibility:hidden;margin-top:-20px}
  .settle-right .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .settle-right .fg3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .settle-right .fg3>.btn{grid-column:1/-1}}
details#tierBox>summary{list-style:revert}
.th-sort{border:0;background:none;padding:0;font:inherit;color:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.th-sort .ar{margin-left:3px;font-size:11px;opacity:.45}
.th-sort.on{color:var(--accent)}.th-sort.on .ar{opacity:1}
.exl{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:8px;background:var(--sunken);border:1px solid var(--line)}
.exg{display:flex;flex-direction:column;gap:6px}
.exg .tag{align-self:flex-start}
.exn{display:flex;flex-wrap:wrap;gap:6px}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:14px}
.subtabs.mtab{display:none}
.two>[data-ms]{display:flex;flex-direction:column;min-width:0}.two>[data-ms]>.panel{flex:1}
@media (max-width:820px){.subtabs.mtab{display:flex}.mt-host [data-ms]:not([data-on]){display:none!important}}
.check-below{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.check-below{grid-template-columns:minmax(0,1fr)}.check-below.has-open .sheet-col{order:-1}}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg2 button{border:0;background:var(--surface);padding:6px 12px;font-size:14px;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.catbox{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 12px;border-radius:8px;background:var(--sunken)}
.slot{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px;flex:1 1 130px;min-width:0}
.slot .qn{font-weight:600;font-size:14px;color:var(--cc)}
.slot .qs{font-size:12px;color:var(--muted)}
.slot.new{border-style:dashed;background:var(--surface)}
.slot.done{background:color-mix(in srgb,var(--cc) 10%,var(--surface));border-color:color-mix(in srgb,var(--cc) 40%,var(--line))}
.slot[aria-current="true"]{outline:2px solid var(--cc);outline-offset:1px}
.slot:hover:not(:disabled){border-color:var(--cc)}
.slot:disabled{opacity:.55;cursor:default}
.logrow{display:grid;grid-template-columns:92px 88px minmax(0,1fr);gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:start}
.logrow .w{color:var(--muted)}
@media (max-width:600px){.logrow{grid-template-columns:1fr auto}.logrow .d{grid-column:1/-1}}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:end}
.formgrid .full{grid-column:1/-1}
.slist{display:flex;flex-direction:column;gap:2px;max-height:520px;overflow-y:auto;margin:0 -6px;padding:0 6px}
.sday{font-size:13px;color:var(--muted);font-weight:600;padding:10px 4px 4px}
.sitem{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:8px;border:1px solid transparent;background:none;text-align:left;width:100%;flex-wrap:wrap}
.sitem:hover{background:var(--sunken)}
.sitem[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.sitem .cnt{margin-left:auto;font-size:13px;color:var(--muted)}

.counts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.counts b{font-weight:600}
.c-o{color:var(--good)} .c-a{color:var(--warn)} .c-x{color:var(--seal)} .c-n{color:var(--muted)}
.notebox{background:var(--sunken);border-radius:8px;padding:8px 12px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.mlist{display:grid;grid-template-columns:minmax(0,1fr);column-gap:24px;border-top:1px solid var(--line)}
@media (min-width:1000px){.mlist{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mrow{display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:1px solid var(--line);min-width:0}
.mrow .nm{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:4px 6px;overflow:hidden}
.mrow .nm>.mn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;min-width:0}
.mrow .nm .tag{flex:none}
.mrow .by{display:none}
.by{font-size:12px;color:var(--muted);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface);padding:5px 9px;font-size:14px;font-weight:500;color:var(--muted);min-width:44px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"][data-v="O"]{background:var(--good);color:#fff}
.seg button[aria-pressed="true"][data-v="A"]{background:var(--warn);color:#fff}
.seg button[aria-pressed="true"][data-v="X"]{background:var(--seal);color:#fff}
.seg button:disabled{cursor:default}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px;border-radius:8px;background:var(--seal-soft);color:var(--seal);font-size:14px}

/* 통계 */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:720px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile .v{font-size:28px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--muted);letter-spacing:.02em}
.tile.alert .v{color:var(--seal)}
.scroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th{font-size:13px;font-weight:600;color:var(--muted);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tr.low td{background:color-mix(in srgb,var(--seal) 7%,transparent)}
tr.low td:first-child{box-shadow:inset 3px 0 0 var(--seal)}
.rate{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.bar{width:80px;height:6px;border-radius:3px;background:var(--sunken);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}
tr.low .bar i{background:var(--seal)}
.dash{color:var(--muted)}
.heat{border-radius:6px;padding:4px 8px;display:inline-block;min-width:64px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
svg text{fill:var(--muted);font-family:var(--f-body)}
.demo-banner{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:500}
.attn{display:flex;flex-wrap:wrap;gap:8px}
.attn .who{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;background:var(--sunken);border:1px solid var(--line);font-size:15px}
textarea.preview{min-height:180px;font-size:14px;line-height:1.6}

.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{color:var(--ink);font-size:17px}

/* 문파원 */
.members-grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.members-grid{grid-template-columns:minmax(0,1fr)}}
.medit{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.medit input[type=text]{flex:1 1 110px;min-width:90px}
.medit select{max-width:110px}
.medit .acts .btn.small{padding:4px 8px}
.medit.off{opacity:.55}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:8px;font-size:15px;max-width:calc(100% - 32px);z-index:30}
.overlay{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:25;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.overlay .panel{width:min(520px,100%)}
.overlay .panel.wide{width:min(820px,100%);max-height:calc(90vh / var(--zoom,1));overflow:auto}
.overlay .panel.wide>*{flex-shrink:0}
.lnk{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent);text-underline-offset:3px}
.lnk:hover{color:var(--accent)}
.zoomctl{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.zoomctl button{border:0;background:none;padding:4px 10px;font-size:14px;color:var(--ink);min-width:34px;font-variant-numeric:tabular-nums}
.zoomctl button+button{border-left:1px solid var(--line)}
.zoomctl button:hover:not(:disabled){background:var(--sunken)}
.zoomctl button:disabled{opacity:.35;cursor:default}
.authwho{font-size:14px;color:var(--muted)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--sunken);border:1px solid var(--line);border-radius:6px;padding:2px 6px;overflow-wrap:anywhere}
.mk{font-size:13px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.mk.O{background:var(--good-soft);color:var(--good)} .mk.A{background:var(--warn-soft);color:var(--warn)} .mk.X{background:var(--seal-soft);color:var(--seal)}

function getEff(){
  if(EFF)return EFF;
  const {members,sessions}=data();const byId=new Map(members.map(m=>[m.id,m]));const lim=excuseLimit();
  const ord=s=>CONTENTS.findIndex(c=>c.k===s.content);
  const reg=sessions.filter(s=>!isBonus(s)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(ord(a)-ord(b))||((a.createdAt||0)-(b.createdAt||0)));
  const used={},map=new Map();
  for(const s of reg){const mk=marksOf(s),e={},mon=s.date.slice(0,7);
    for(const id in mk){const v=mk[id];if(!validMark(v))continue;const m=byId.get(id);if(m&&!eligible(m,s))continue;
      if(v==='A'){const k=id+'|'+mon,u=used[k]||0;if(u<lim){e[id]='E';used[k]=u+1}else e[id]='XA'}else e[id]=v}
    map.set(s.id,e)}
  return EFF=map;
}
function effOf(s,id){if(isBonus(s)){const v=marksOf(s)[id];return validMark(v)?v:null}const e=getEff().get(s.id);return (e&&e[id])||null}
function streakOf(m,filter){
  const gd=gameDay();const ss=data().sessions.filter(s=>s.date<=gd&&!isBonus(s)&&(!filter||filter(s))&&eligible(m,s)).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.createdAt||0)-(a.createdAt||0));
  let n=0;for(const s of ss){const v=effOf(s,m.id);if(!v||v==='E')continue;if(v==='O')break;n++}return n;
}

const eligible=(m,s)=>!m||((!m.joinedAt||s.date>=m.joinedAt)&&!onLeave(m,s.date));

/* ---------- stats ---------- */
function computeStats(opt){
  const {members:allM,sessions:allS}=data();
  const members=opt&&opt.all?allM.slice().sort(memberSort):activeMembers(allM);
  const mid=new Map(members.map(m=>[m.id,m]));
  const from=periodFrom();
  const gd=gameDay();const sessions=(from?allS.filter(s=>s.date>=from):allS.slice()).filter(s=>s.date<=gd);
  const inF=s=>S.cfilter==='all'||s.content===S.cfilter;
  const scoped=sessions.filter(inF);
  const W=warnCfg(),mj=minJudge(),th=W.rate/100,sk=streakMin();
  const per={};members.forEach(m=>per[m.id]={m,O:0,E:0,X:0,XA:0,P:0,B:0,byC:Object.fromEntries(CONTENTS.map(c=>[c.k,{O:0,E:0,X:0}]))});
  for(const s of sessions){
    for(const m of members){if(!eligible(m,s))continue;const v=effOf(s,m.id);if(!v)continue;const p=per[m.id];
      if(isBonus(s)){if(inF(s)&&v==='O'){p.B++;p.P+=sessPts(s)}continue}
      const b=p.byC[s.content];if(b){if(v==='O')b.O++;else if(v==='E')b.E++;else b.X++}
      if(!inF(s))continue;
      if(v==='O'){p.O++;p.P+=sessPts(s)}else if(v==='E')p.E++;else if(v==='XA')p.XA++;else p.X++}}
  const rows=Object.values(per).map(p=>{
    const absent=p.X+p.XA,T=p.O+p.E+absent,rate=rateOf(p.O,absent);
    const mO=MAIN.reduce((a,k)=>a+p.byC[k].O,0),mX=MAIN.reduce((a,k)=>a+p.byC[k].X,0),mT=MAIN.reduce((a,k)=>a+p.byC[k].O+p.byC[k].E+p.byC[k].X,0);
    const hold=T<mj,streak=streakOf(p.m,S.cfilter==='all'?null:inF);
    const mainRate=rateOf(mO,mX),lv=W.scope==='main'?mainRate:rate,lowHold=W.scope==='main'?mT<mj:hold;
    return {...p,absent,T,rate,mainRate,mT,hold,streak,low:!lowHold&&lv!=null&&lv<th,lowVal:lv,streakHit:streak>=sk}});
  rows.sort((a,b)=>(a.hold-b.hold)||(b.rate??-1)-(a.rate??-1)||b.O-a.O||memberSort(a.m,b.m));
  let tO=0,tX=0;rows.forEach(r=>{tO+=r.O;tX+=r.absent});
  const wk={};
  for(const s of scoped){const w=weekStart(s.date);const c=countSession(s,mid);
    const W=wk[w]??={w,n:0,o:0,x:0,byC:{},bonus:null};
    if(isBonus(s)){const B=W.bonus??={n:0,o:0};B.n++;B.o+=c.o;continue}
    W.n++;W.o+=c.o;W.x+=c.x;const B=W.byC[s.content]??={n:0,o:0};B.n++;B.o+=c.o}
  const weeks=Object.values(wk).sort((a,b)=>a.w<b.w?-1:1);
  const dc={};
  const exK=extraCfg().content;for(const s of sessions){const cc=CMAP[s.content];if(!cc||(cc.days.length<2&&s.content!==exK))continue;const key=isBonus(s)?'추가':String(dow(s.date));const c=countSession(s,mid);
    const D=dc[s.content]??={};const C=D[key]??={n:0,o:0,x:0};C.n++;C.o+=c.o;C.x+=c.x}
  return {members,rows,scoped,sessionsN:scoped.length,regN:scoped.filter(s=>!isBonus(s)).length,avg:rateOf(tO,tX),attn:rows.filter(r=>r.low||r.streakHit),weeks,dc,th,sk,mj};
}

function kakaoText(st){
  const L=[`${kG()}출석 현황`,`${periodLabel()}${S.cfilter!=='all'?' · '+(CMAP[S.cfilter]?.name||''):''}`,`정규 ${st.regN}회${st.sessionsN>st.regN?' · 추가 '+(st.sessionsN-st.regN)+'회':''} · 평균 출석률 ${pct(st.avg)}`,KL];
  const top=st.rows.filter(r=>!r.hold&&r.rate!=null&&r.O>0&&!r.low).slice(0,5);
  if(top.length){L.push('🏆 출석 우수');top.forEach((r,i)=>L.push(`${kMed(i+1)} ${r.m.name} ${pct(r.rate)} (참여 ${r.O}회)`));L.push(KL)}
  const low=st.rows.filter(r=>r.low).sort((a,b)=>a.lowVal-b.lowVal);
  L.push(`⚠️ 출석 저조 (${warnCfg().scope==='main'?mainLabel()+' ':''}${Math.round(st.th*100)}% 미만)`,low.length?low.map(r=>`${r.m.name} ${pct(r.lowVal)}`).join(', '):'없음',KL);
  const sk=st.rows.filter(r=>r.streakHit).sort((a,b)=>b.streak-a.streak);

  return L.join('\n');
}

function weekChart(wv){
  const W=520,H=170,L=34,R=8,T=14,B=28,iw=W-L-R,ih=H-T-B;const n=wv.length;const step=iw/n;const bw=Math.min(36,step*0.6);
  let g='';[0,50,100].forEach(p=>{const y=T+ih*(1-p/100);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="12">${p}%</text>`});
  wv.forEach((w,i)=>{const r=rateOf(w.o,w.x)??0;const h=ih*r;const x=L+step*i+(step-bw)/2;const last=i===n-1;
    g+=`<rect x="${x}" y="${T+ih-h}" width="${bw}" height="${Math.max(h,1)}" rx="3" fill="var(--accent)" opacity="${last?1:.55}"><title>${md(w.w)} 주 ${pct(r)}</title></rect>`;
    if(last||n<=8)g+=`<text x="${x+bw/2}" y="${Math.max(T+ih-h-4,11)}" text-anchor="middle" font-size="12" style="fill:var(--ink)">${Math.round(r*100)}</text>`;
    if(n<=8||i%2===(n-1)%2)g+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="12">${md(w.w)}~</text>`});
  return `<div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;min-width:300px;display:block" role="img" aria-label="주간 출석률 막대그래프">${g}</svg></div>`;
}

async function readJson(f){
  S.jimp={loading:true};render();
  try{const j=JSON.parse(await f.text());if(!j||j.app!=='guild-attendance'||!j.data)throw new Error('format');
    S.olderRange=null;await loadOlderAll();
    const have={members:new Set(S.members.map(x=>x.id)),sessions:new Set(allSessions().map(x=>x.id)),warnings:new Set(S.warnings.map(x=>x.id)),notes:new Set(Object.keys(S.notes)),rewards:new Set(S.rewards.map(x=>x.id)),purchases:new Set(S.purchases.map(x=>x.id)),notices:new Set(S.notices.map(x=>x.id)),locks:new Set(Object.keys(S.locks)),admins:new Set(S.admins.map(x=>x.id))};
    const cols=[...JCOLS,...(S.isOwner&&j.data.admins?['admins']:[])];const plan={};let total=0;
    for(const c of cols){const list=(Array.isArray(j.data[c])?j.data[c]:[]).filter(x=>x&&typeof x.id==='string'&&x.id&&!x.id.includes('/')&&x.d&&typeof x.d==='object');plan[c]={all:list.length,add:list.filter(x=>!have[c].has(x.id))};total+=plan[c].add.length}
    S.jimp={plan,total,cols,config:j.data.config||null,exportedAt:j.exportedAt,guild:j.guild||''}}
  catch(e){console.error(e);S.jimp={error:'이 페이지에서 받은 완전 백업(JSON) 파일이 아니에요.'}}
  render();
}

}

function monthStats(mon){

  const gd=gameDay();const ss=allS.filter(s=>s.date.slice(0,7)===mon&&s.date<=gd);const reg=ss.filter(s=>!isBonus(s)).length;

  const rows=members.map(m=>{let O=0,E=0,X=0,XA=0,B=0,P=0,need=0,ok=0,mO=0,mX=0,mT=0;
    for(const s of ss){if(!eligible(m,s))continue;const v=effOf(s,m.id);

      need++;if(!v)continue;const main=MAIN.includes(s.content);if(main)mT++;
      if(v==='O'){O++;ok++;P+=sessPts(s);if(main)mO++}else if(v==='E'){E++;ok++}else{if(v==='XA')XA++;else X++;if(main)mX++}}

}

/* ---------- 금전 분배 (판매 금액을 포인트 등급으로 나눔) ---------- */
const DEFAULT_TIERS=[{min:20,pct:100},{min:10,pct:80},{min:5,pct:50}];
const won=n=>Math.round(+n||0).toLocaleString('ko-KR');
function payCfg(){const c=S.config.pay||{};const t=Array.isArray(c.tiers)&&c.tiers.length?c.tiers:DEFAULT_TIERS;
  const tiers=t.map(x=>({min:Math.max(0,Math.round(+x.min||0)),pct:Math.min(100,Math.max(1,Math.round(+x.pct||0)))})).sort((a,b)=>b.min-a.min);
  return {tiers,minRate:num(c.minRate,0,0,100),exHold:c.exHold!==false}}
function tierOf(P,tiers){return tiers.find(t=>P>=t.min)||null}
function payCalc(ms,amount){
  const C=payCfg();const rows=[],out=[];
  for(const r of ms.rows){const t=tierOf(r.P,C.tiers);let why='';
    let g='',v='';
    if(C.exHold&&r.hold){why='판정 보류';g='판정 보류 (기록 부족)';v=`${r.T}회`}
    else if(C.minRate>0&&(r.rate==null||r.rate*100<C.minRate)){why=`출석률 ${pct(r.rate)} (${C.minRate}% 미만)`;g=`출석률 ${C.minRate}% 미만`;v=pct(r.rate)}
    else if(!t){const lo=C.tiers.length?C.tiers[C.tiers.length-1].min:0;why=`포인트 ${r.P}점 (${C.tiers.length?lo+'점 미만':'등급 없음'})`;g=C.tiers.length?`포인트 ${lo}점 미만`:'등급 없음';v=`${r.P}점`}
    if(why)out.push({r,why,g,v});else rows.push({r,pct:t.pct,share:t.pct/100})}
  const shares=rows.reduce((a,x)=>a+x.share,0);const unit=shares?amount/shares:0;

function calcDist(){
  const ms=monthStats(curMonth());const N=Math.floor(+$('#dQty').value);if(!(N>0)){toast('총 수량을 입력해 주세요');return}
  const name=$('#dName').value.trim()||'보상',mode=$('#dMode').value==='equal'?'equal':'pts',exF=$('#dExF').checked,exH=$('#dExH').checked;
  const elig=ms.rows.filter(r=>r.P>0&&!(exF&&r.fail)&&!(exH&&r.hold));
  if(!elig.length){S.dist=null;render();toast('조건에 맞는 문파원이 없어요');return}
  const tot=mode==='equal'?elig.length:elig.reduce((a,r)=>a+r.P,0);
  const items=elig.map(r=>{const raw=N*(mode==='equal'?1:r.P)/tot;const n=Math.floor(raw+1e-9);return {r,n,frac:raw-n}});
  let left=N-items.reduce((a,x)=>a+x.n,0);
  items.slice().sort((a,b)=>b.frac-a.frac||b.r.P-a.r.P||memberSort(a.r.m,b.r.m)).forEach(x=>{if(left>0){x.n++;left--}});
  items.sort((a,b)=>b.n-a.n||b.r.P-a.r.P||memberSort(a.r.m,b.r.m));
  S.dist={mon:ms.mon,name,N,mode,tot,exF,exH,items,excluded:ms.rows.filter(r=>!elig.includes(r))};render();
}

function buyCfg(){const b=S.config.buy||{};return {days:num(b.days,28,1,365),min:num(b.min,6,0,1000),lock:num(b.lock,28,0,365),exWarn:b.exWarn!==false,start:/^\d{4}-\d{2}-\d{2}$/.test(b.start||'')?b.start:''}}

function lastBuy(mid){let d='';for(const p of buyList())if(p.mid===mid&&p.date>d)d=p.date;return d}
function ensureAll(){
  if(S.demo||!S.db||!S.cutoff||S.olderRange==='all'||S.olderLoading||S.olderFail)return;
  S.olderLoading=true;
  loadOlderAll().catch(e=>{console.error(e);S.olderFail=true;toast('전체 기록을 불러오지 못했어요. 새로고침해 주세요')}).finally(()=>{S.olderLoading=false;EFF=null;render()});
}
function buyStats(){
  const C=buyCfg(),t=gameDay(),recFrom=addDays(t,-(C.days-1)),cur=t.slice(0,7),prev=monthAdd(cur,-1);
  const partial=!S.demo&&!!S.db&&S.olderRange!=='all'&&!S.olderFail;if(partial)setTimeout(ensureAll,0);
  const {members,sessions}=data();
  const rows=activeMembers(members).map(m=>{const lb=lastBuy(m.id);let P=0,Rc=0;
    for(const s of sessions){if(s.date>t||!eligible(m,s)||effOf(s,m.id)!=='O')continue;const p=sessPts(s);
      if((!lb||s.date>lb)&&(!C.start||s.date>=C.start))P+=p;if(s.date>=recFrom)Rc+=p}
    const until=lb&&C.lock?addDays(lb,C.lock):'';let why='';
    if(onLeave(m,t))why='휴식 중';
    else if(until&&t<until)why=`구매 후 대기 · ${md(until)}부터 가능`;
    else if(Rc<C.min)why=`최근 ${C.days}일 포인트 부족 · ${Rc}/${C.min}점`;
    else if(C.exWarn&&S.canWrite&&S.warnings.some(w=>w.mid===m.id&&(w.month===cur||w.month===prev)))why='지난달·이번 달 경고';
    return {m,P,R:Rc,lb,until,why}});
  const ok=rows.filter(r=>!r.why).sort((a,b)=>b.P-a.P||memberSort(a.m,b.m)),no=rows.filter(r=>r.why).sort((a,b)=>b.P-a.P||memberSort(a.m,b.m));
  const cnt={};ok.forEach(r=>cnt[r.P]=(cnt[r.P]||0)+1);
  let rank=0,prevP=null;ok.forEach((r,i)=>{if(r.P!==prevP){rank=i+1;prevP=r.P}r.rank=rank;r.tie=cnt[r.P]>1});
  return {C,t,ok,no,rows,partial};
}

/* ---------- CSV 가져오기 ---------- */
function parseCsv(t){t=t.replace(/^﻿/,'');const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===','){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}
    else cur+=c}
  if(cur||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()));
}
async function loadOlderAll(){
  if(S.olderRange==='all'||!S.db||!S.cutoff)return;
  const snap=await S.db.collection('sessions').where('date','<',S.cutoff).orderBy('date','desc').get();
  S.older=snap.docs.map(d=>normS({id:d.id,...d.data()})).filter(s=>s.date&&s.content);S.olderRange='all';
}
function buildImport(text){
  const rows=parseCsv(text);if(rows.length<2)return {error:'내용이 없는 파일이에요.'};
  const h=rows[0].map(x=>x.trim());if(h[0]!=='닉네임')return {error:'이 페이지에서 내보낸 CSV가 아니에요. 첫 칸 제목이 "닉네임"이어야 해요.'};
  const SH={};if(CMAP.rank){SH['요신']='rank';SH['결계']='rank'}CONTENTS.forEach(c=>{SH[c.short]=c.k});const alt=Object.keys(SH).sort((a,b)=>b.length-a.length).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');const cols=[];
  const re=new RegExp('^(\\d{4}-\\d{2}-\\d{2})(?:\\([^)]*\\))?\\s*('+alt+')(\\(추가\\))?$');h.forEach((x,i)=>{const m=x.match(re);if(m)cols.push({i,date:m[1],content:SH[m[2]],extra:!!m[3]})});
  if(!cols.length)return {error:'회차 열을 찾지 못했어요. 날짜에 연도가 들어간 CSV(이번 버전에서 내보낸 파일)만 가져올 수 있어요.'};
  const ri=h.indexOf('직위'),si=h.indexOf('상태'),ji=h.indexOf('가입일');const MK={'참여':'O','사전공지':'A','불참':'X'};const people=[];let marks=0;
  for(const r of rows.slice(1)){const name=(r[0]||'').trim().slice(0,24);if(!name)continue;
    const rr=ri>=0?(r[ri]||'').trim():'';const mk={};
    cols.forEach((c,ci)=>{const v=MK[(r[c.i]||'').trim()];if(v){mk[ci]=v;marks++}});
    const jd=ji>=0?(r[ji]||'').trim():'';people.push({name,role:ROLES.includes(rr)?rr:baseRole(),mk,active:!(si>=0&&['탈퇴','이동'].includes((r[si]||'').trim())),moved:si>=0&&(r[si]||'').trim()==='이동',joinedAt:/^\d{4}-\d{2}-\d{2}$/.test(jd)?jd:''})}
  const have=new Set(S.members.map(m=>m.name));
  const newSess=cols.filter(c=>!findAny(c.date,c.content,c.extra)).length;
  return {cols,people,marks,newPeople:people.filter(x=>!have.has(x.name)).length,newSess,oldSess:cols.length-newSess};
}
async function readImport(f){
  S.imp={loading:true};render();
  try{const text=await f.text();S.olderRange=null;await loadOlderAll();S.imp=buildImport(text)}catch(e){console.error(e);S.imp={error:'파일을 읽지 못했어요. CSV 파일이 맞는지 확인해 주세요.'}}
  render();
}
async function runImport(){
  const I=S.imp;if(!I||I.error||I.running||!I.cols)return;I.running=true;I.done=0;render();
  const ok=await guard(async()=>{
    const byName=new Map(S.members.map(m=>[m.name,m.id]));
    for(const x of I.people){if(byName.has(x.name))continue;const ref=S.db.collection('members').doc();
      await ref.set({name:x.name,role:x.role,active:x.active!==false,moved:!!x.moved,joinedAt:x.joinedAt||'',createdAt:Date.now(),createdBy:myName()+' (가져오기)'});byName.set(x.name,ref.id)}
    for(let ci=0;ci<I.cols.length;ci++){const c=I.cols[ci];if(isLocked(c.date)){I.skipped=(I.skipped||0)+1;continue}const s=findAny(c.date,c.content,c.extra);
      const cur=s?(s.marks||{}):{};const add={},by={};const now=Date.now();
      for(const x of I.people){const v=x.mk[ci];if(!v)continue;const id=byName.get(x.name);if(validMark(cur[id]))continue;add[id]=v;by[id]={by:myName()+' (가져오기)',at:now}}
      if(s){if(Object.keys(add).length)await S.db.doc('sessions/'+s.id).update({marks:add,marksBy:by,updatedAt:now,updatedBy:myName()})}
      else{const id=await createSess(c.date,c.content,c.extra);if(Object.keys(add).length)await S.db.doc('sessions/'+id).update({marks:add,marksBy:by,updatedAt:now,updatedBy:myName()})}
      I.done=ci+1;if(ci%5===4)render()}
  });
  S.olderRange=null;S.older=[];if(S.period==='52'||S.period==='all')ensureOlder();
  S.imp=ok?{finished:true,count:I.cols.length-(I.skipped||0),skipped:I.skipped||0}:null;render();if(ok){toast('가져오기를 마쳤어요');writeLog({type:'act',area:'백업',what:'CSV 가져오기',detail:`회차 ${I.cols.length-(I.skipped||0)}개 · 문파원 ${I.people.length}명`})}
}
function renderImport(){

      ${I.running?`<p class="hint">가져오는 중… ${I.done}/${I.cols.length} 회차</p>`:'<div class="row"><button class="btn primary" data-action="impRun">가져오기</button><button class="btn" data-action="impClear">취소</button></div>'}`}
  return `<div class="panel"><h2>가져오기</h2>
    ${notes(['<b>전체 기록 CSV 받기</b>로 받은 파일을 골라 기록을 복원해요','없는 문파원과 회차는 새로 만들고, 이미 체크된 칸은 덮어쓰지 않아요. 마감된 달은 건너뛰어요','백업에는 탈퇴한 문파원과 가입일이 들어가고, 휴식 기간·메모·경고·지급 기록·구매 내역은 들어가지 않아요. 지급 기록과 구매 내역은 각 화면의 CSV 내보내기로 받아 두세요'])}
    <label class="f">가져올 CSV 파일<input type="file" id="impFile" data-keep="0" accept=".csv,text/csv" data-action="impFile" aria-label="CSV 파일 고르기"></label>${body}</div>`;
}

/* 6개월보다 오래된 기록: '최근 1년'이나 '전체 기간'을 고를 때만 한 번 불러옴 */
async function ensureOlder(){
  if(S.demo||!S.db||!S.cutoff)return;
  const need=S.period==='all'?'all':S.period==='52'?'52':null;if(!need)return;
  if(S.olderRange==='all'||S.olderRange===need||S.olderLoading)return;
  S.olderLoading=true;render();
  try{let q=S.db.collection('sessions').where('date','<',S.cutoff);
    if(need==='52')q=q.where('date','>=',addDays(weekStart(todayStr()),-7*51));
    const snap=await q.orderBy('date','desc').get();
    S.older=snap.docs.map(d=>normS({id:d.id,...d.data()})).filter(s=>s.date&&s.content);S.olderRange=need;
  }catch(e){console.error(e);toast('이전 기록을 불러오지 못했어요. 잠시 후 다시 골라 주세요')}
  S.olderLoading=false;render();
}

    if(e&&e.code==='invalid_argument'){toast('저장 권한이 없어요. 운영진 등록과 Firestore 규칙이 최신인지 확인해 주세요');console.warn(e);return false}

    toast('저장하지 못했어요. 잠시 후 다시 시도해 주세요');console.error(e);return false}

async function createSess(date,content,extra){
  const data={date,content,extra:!!extra,marks:{},marksBy:{},note:'',rank:'',createdAt:Date.now(),createdBy:myName()};
  const id=sessId(date,content,extra);
  const lg=sid=>writeLog({type:'create',sid,date,content,extra:!!extra});
  if(await S.db.create('sessions/'+id,data)){lg(id);return id}
  const x=await S.db.doc('sessions/'+id).get();
  if(x.exists){const d=normS({id,...x.data()});if(d.date===date&&d.content===content&&!!d.extra===!!extra)return id}
  const ref=S.db.collection('sessions').doc();await ref.set(data);lg(ref.id);return ref.id;
}
async function createSession(date,content,extra){
  const ex=findAny(date,content,extra);
  if(!ex&&isLocked(date)){toast(`${monLabel(date.slice(0,7))}은 마감돼서 회차를 만들 수 없어요`);return}
  if(ex){S.openSid=ex.id;S.editSid=null;render();scrollSheet();return}
  if(!extra){const w=sameWeekReg(date,content);if(w){toast(`${CMAP[content]?.name||content}은 이번 주 ${mdd(w.date)}에 이미 있어요. 정규 회차는 한 주에 한 번이에요`);S.openSid=w.id;S.editSid=null;render();scrollSheet();return}}
  await guard(async()=>{const id=await createSess(date,content,extra);S.openSid=id;S.editSid=null;render();scrollSheet()});
}
function scrollSheet(){if(innerWidth<820)$('#sheetCol')?.scrollIntoView({behavior:'smooth',block:'start'})}
function queueMark(sid,mid,v){(pending[sid]??={})[mid]=v;render();clearTimeout(flushTimer);flushTimer=setTimeout(flush,350)}
async function flush(){
  if(flushing){clearTimeout(flushTimer);flushTimer=setTimeout(flush,300);return}
  const batch=pending;pending={};if(!Object.keys(batch).length)return;flushing=true;
  for(const sid in batch){inflight[sid]=Object.assign(inflight[sid]||{},batch[sid])}
  for(const sid in batch){
    const s=S.sessions.find(x=>x.id===sid),before=(s&&s.marks)||{};
    const now=Date.now(),by={};for(const mid in batch[sid])by[mid]={by:myName(),at:now};
    const ok=await guard(()=>S.db.doc('sessions/'+sid).update({marks:batch[sid],marksBy:by,updatedAt:now,updatedBy:myName()}));
    if(ok&&s){const ch={};for(const mid in batch[sid]){const f=validMark(before[mid])?before[mid]:null,t=batch[sid][mid]||null;if(f!==t)ch[mid]={f,t,n:memberName(mid)}}
      if(Object.keys(ch).length)writeLog({type:'mark',sid,date:s.date,content:s.content,extra:!!s.extra,changes:ch})}
    for(const mid in batch[sid]){if(inflight[sid]&&inflight[sid][mid]===batch[sid][mid])delete inflight[sid][mid]}
  }
  flushing=false;render();
}
function copyText(text,msg){
  const fallback=()=>{const box=$('#copybox'),ta=$('#copyArea');ta.value=text;box.hidden=false;ta.focus();ta.select()};
  try{const p=navigator.clipboard&&navigator.clipboard.writeText(text);
    if(!p){fallback();return}
    p.then(()=>toast(msg||'복사했어요. 카톡에 붙여 넣으세요'),fallback)}catch(_){fallback()}
}

/* ---------- demo (통계 미리보기 전용, 저장 안 함) ---------- */
let demoCache=null;
function demoData(){
  if(demoCache)return demoCache;
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const members=Array.from({length:14},(_,i)=>({id:'d'+i,name:'예시문파원'+(i+1),role:i===0?'문주':i<3?'부문주':i<5?'간부':'문파원',active:true,p:0.3+rnd()*0.65}));
  const sessions=[];const base=addDays(todayStr(),-((dow(todayStr())+6)%7));
  for(let w=7;w>=0;w--){const mon=addDays(base,-7*w);
    const days=[[addDays(mon,4),['singi','rank']],[addDays(mon,5),['mihok']]];
    if(rnd()<0.5)days.push([addDays(mon,1),['rank']]);
    for(const [d,ks] of days){if(d>todayStr())continue;ks.forEach(k=>{const marks={};
      members.forEach(m=>{const r=rnd();const p=m.p*(dow(d)===2?0.75:1);marks[m.id]=r<p?'O':r<p+0.12?'A':'X'});
      sessions.push({id:'s'+sessions.length,date:d,content:k,extra:dow(d)===2,marks})})}}
  const t=todayStr();const purchases=[{id:'dp1',mid:'d2',name:members[2].name,item:'스킬 선택상자',date:addDays(t,-9),price:70000,by:'예시'},{id:'dp2',mid:'d6',name:members[6].name,item:'스킬 선택상자',date:addDays(t,-33),price:70000,by:'예시'}];
  return demoCache={members,sessions,purchases};
}

function flat(obj,pre,out){out=out||{};for(const k in obj){const v=obj[k];const key=pre?pre+'.'+k:k;
  if(v&&typeof v==='object'&&!Array.isArray(v)&&Object.keys(v).length)flat(v,key,out);else out[key]=v}return out}
function makeDb(fs){
  const D=ref=>({id:ref.id,path:ref.path,
    set:d=>setDoc(ref,d).catch(e=>{throw mapErr(e)}),
    update:d=>updateDoc(ref,flat(d)).catch(e=>{throw mapErr(e)}),
    delete:()=>deleteDoc(ref).catch(e=>{throw mapErr(e)}),
    get:()=>getDoc(ref).then(wrapSnap).catch(e=>{throw mapErr(e)}),
    onSnapshot:(n,er)=>fsnap(ref,x=>n(wrapSnap(x)),e=>er&&er(mapErr(e)))});
  const Q=(q,cref)=>({doc:id=>D(id?fdoc(cref,id):fdoc(cref)),
    get:()=>getDocs(q).then(x=>({docs:x.docs.map(wrapSnap),size:x.size,empty:x.empty})).catch(e=>{throw mapErr(e)}),
    orderBy:(f,d)=>Q(query(q,fOrder(f,d||'asc')),cref),where:(f,o,v)=>Q(query(q,fWhere(f,o,v)),cref),limit:n=>Q(query(q,fLimit(n)),cref),
    onSnapshot:(n,er)=>fsnap(q,x=>n({docs:x.docs.map(wrapSnap),size:x.size,empty:x.empty}),e=>er&&er(mapErr(e)))});
  return {doc:p=>D(fdoc(fs,p)),collection:p=>{const c=fcol(fs,p);return Q(c,c)},
    create:(p,d)=>runTransaction(fs,async tx=>{const r=fdoc(fs,p);const x=await tx.get(r);if(x.exists())return false;tx.set(r,d);return true}).catch(e=>{throw mapErr(e)})};
}

/* ---------- boot ---------- */
render();
(function(){
  if(!FIREBASE_CONFIG.apiKey||!FIREBASE_CONFIG.projectId){S.setup=true;render();return}
  let app;try{app=initializeApp(FIREBASE_CONFIG)}catch(e){console.error(e);S.err=true;render();return}
  S.fs=getFirestore(app);S.auth=getAuth(app);S.db=makeDb(S.fs);
  const db=S.db;
  const got={m:false,s:false};const done=()=>{if(got.m&&got.s)S.ready=true;render()};
  const onErr=e=>{console.error(e);S.err=e&&e.code==='quota_exceeded'?'quota':true;render()};
  db.collection('members').onSnapshot(snap=>{S.members=snap.docs.map(d=>({id:d.id,...d.data()}));got.m=true;done()},onErr);
  S.cutoff=addDays(todayStr(),-182).slice(0,7)+'-01';
  db.collection('sessions').where('date','>=',S.cutoff).orderBy('date','desc').limit(1000).onSnapshot(snap=>{
    S.sessions=snap.docs.map(d=>normS({id:d.id,...d.data()})).filter(s=>s.date&&s.content);got.s=true;done()},onErr);
  db.collection('purchases').onSnapshot(snap=>{S.purchases=snap.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.mid&&p.date);S.buyBlocked=false;render()},e=>{console.warn(e);S.buyBlocked=true;render()});
  db.collection('notices').onSnapshot(snap=>{S.notices=snap.docs.map(d=>({id:d.id,...d.data()})).filter(n=>n&&(n.title||n.body));S.noticeBlocked=false;render()},e=>{console.warn(e);S.noticeBlocked=true;render()});
  db.collection('locks').onSnapshot(snap=>{S.locks=Object.fromEntries(snap.docs.map(d=>[d.id,d.data()]));render()},()=>{});
  db.doc('config/main').onSnapshot(snap=>{if(snap.exists)S.config=Object.assign({...CFG0},snap.data());render()},()=>{});
  let unAdmins=null,unWarn=null,unNotes=null,unRw=null,unLogs=null;
  onAuthStateChanged(S.auth,async u=>{
    S.authKnown=false;
    S.authUser=u;S.canWrite=false;S.payOpen=null;S.man=null;S.leaveFor=null;S.noteFor=null;S.cdraft=null;S.isOwner=false;S.myNick='';S.admins=[];if(unAdmins){unAdmins();unAdmins=null}
    if(unWarn){unWarn();unWarn=null}if(unNotes){unNotes();unNotes=null}if(unRw){unRw();unRw=null}if(unLogs){unLogs();unLogs=null}S.logs=[];S.plogs=null;S.notes={};S.rewards=[];S.warnings=[];S.warnBlocked=false;S.logBlocked=false;S.hist=null;S.delLogs=null;S.dist=null;
    if(u){
      const email=(u.email||'').toLowerCase();
      try{const x=await getDoc(fdoc(S.fs,'admins',email));if(x.exists()){S.canWrite=true;S.myNick=x.data().nick||''}}catch(_){}
      try{await getDocs(query(fcol(S.fs,'admins'),fLimit(1)));S.isOwner=true;S.canWrite=true;
        unAdmins=fsnap(fcol(S.fs,'admins'),x=>{S.admins=x.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>nameCmp(a.nick,b.nick,'ko'));render()},()=>{})}catch(_){}
      if(S.canWrite){const blk=e=>{console.warn(e);S.warnBlocked=true;render()};
        unWarn=fsnap(fcol(S.fs,'warnings'),x=>{S.warnings=x.docs.map(d=>({id:d.id,...d.data()}));render()},blk);
        unNotes=fsnap(fcol(S.fs,'notes'),x=>{S.notes=Object.fromEntries(x.docs.map(d=>[d.id,d.data()]));render()},blk);
        unRw=fsnap(fcol(S.fs,'rewards'),x=>{S.rewards=x.docs.map(d=>({id:d.id,...d.data()}));render()},blk);
        unLogs=fsnap(query(fcol(S.fs,'logs'),fOrder('at','desc'),fLimit(300)),x=>{S.logs=x.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.at||0)-(a.at||0));render()},e=>{console.warn(e);S.logBlocked=true;render()})}
    }
    S.authKnown=true;render();
  });
})();
})();
</script>
